<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <title>History &amp; Search Icon</title>
  
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <style>
    /* Clean, scalable styling for the thick outlined aesthetic */
    .outline-thick { 
      stroke: #111827; 
      stroke-width: 18; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
      fill: none; 
    }
    .outline-med { 
      stroke: #111827; 
      stroke-width: 8; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
      fill: none; 
    }
    .purple-fill { 
      stroke: url(#purpleGrad); 
      stroke-width: 8; 
      stroke-linecap: round; 
      stroke-linejoin: round; 
      fill: none; 
    }
    .solid-black { fill: #111827; }
    .blue-ring { fill: #3B82F6; }
    .yellow-dot { fill: #FCD34D; stroke: #111827; stroke-width: 6; }
  </style>

  <g transform="translate(6, 6)">
    
    <path class="outline-med" d="M 125 10 A 95 95 0 0 1 190 65" />
    <path class="outline-med" d="M 15 95 A 95 95 0 0 0 75 195" />
    <path class="outline-med" d="M 65 15 A 95 95 0 0 1 85 9" />
    <path class="outline-med" d="M 198 90 A 95 95 0 0 1 202 110" />


    <path class="outline-thick" d="M 50 150 A 70 70 0 0 0 175 105 A 70 70 0 0 0 105 35 L 75 35" />
    <path class="outline-thick" d="M 75 10 L 40 35 L 75 60 Z" fill="#111827" />

    <path class="outline-thick" d="M 180 180 L 215 215" />
    
    <path class="outline-med" d="M 105 105 L 105 60" />
    <path class="outline-med" d="M 105 105 L 60 105" />


    <path class="purple-fill" d="M 50 150 A 70 70 0 0 0 175 105 A 70 70 0 0 0 105 35 L 75 35" />
    
    <path d="M 75 10 L 40 35 L 75 60 Z" fill="url(#purpleGrad)" stroke="url(#purpleGrad)" stroke-width="6" stroke-linejoin="round" />
    <path d="M 53 148 A 67 67 0 0 0 172 105 A 67 67 0 0 0 105 38 L 75 38" stroke="#D8B4FE" stroke-width="2" fill="none" />

    <circle cx="105" cy="105" r="7" class="yellow-dot" />

    <path d="M 180 180 L 212 212" stroke="#334155" stroke-width="8" stroke-linecap="round" />
    <path d="M 195 205 L 205 195" stroke="#111827" stroke-width="6" stroke-linecap="round" />
    <path d="M 210 220 L 220 210" stroke="#111827" stroke-width="6" stroke-linecap="round" />


    <circle cx="160" cy="160" r="40" class="solid-black" />
    <circle cx="160" cy="160" r="34" class="blue-ring" />
    <circle cx="160" cy="160" r="26" class="solid-black" />
    <circle cx="160" cy="160" r="20" fill="url(#glassGrad)" />
    
    <path d="M 148 148 A 15 15 0 0 1 165 142" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
    
  </g>
</svg>
