[project]
name = "eval"
version = "0.1.0"
description = "English evaluation harness for the LPN AI-BI /v1/qa pipeline."
requires-python = ">=3.11,<3.12"
dependencies = [
    "click>=8.1.8",
    "httpx>=0.28.0",
    "pandas>=2.2.3",
]

[project.scripts]
eval = "eval.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval"]
