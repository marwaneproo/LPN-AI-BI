[project]
name = "predictive"
version = "0.1.0"
description = "Predictive analytics service for the LPN AI-BI platform."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "lightgbm>=4.5.0,<5",
    "scikit-learn>=1.3,<2",
    "pandas>=2.2.3",
    "prophet>=1.1,<2",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "statsmodels>=0.14.0,<1",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "pytest-anyio>=0.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["predictive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
