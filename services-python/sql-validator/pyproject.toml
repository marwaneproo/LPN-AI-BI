[project]
name = "sql-validator"
version = "0.1.0"
description = "SQL validation service for the LPN AI-BI platform."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "sqlglot>=26.0.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sql_validator"]
