[project]
name = "data-import"
version = "0.1.0"
description = "Snapshot import tooling for the LPN AI-BI platform."
requires-python = ">=3.11,<3.12"
dependencies = [
    "click>=8.1.8",
    "fastapi>=0.115.0",
    "openpyxl>=3.1",
    "pandas>=2.2.3",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
data-import = "data_import.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_import"]
